# tflint/trivy are inherited from the repo-root mise.toml.
# Run tasks with `mise run <task>`, list them with `mise tasks`.
[tasks.sweep]
description = "list (or --force delete) the on-demand backups the action created"
run = "./sweep.sh"

[tasks.teardown]
description = "destroy the lab, then delete the backups destroy leaves behind"
run = ["./sweep.sh --force", "terraform destroy"]
