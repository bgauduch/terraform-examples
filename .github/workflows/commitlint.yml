name: Commit messages

# Scoped to `pull_request`, not `push`: on a push the action lints the `before..after`
# range, which after a rebase or force-push spans commits already merged into `main`
# (release-please bodies carry a >100-char bot trailer) and fails a PR whose own commits
# all conform. On `pull_request` the range is `base..head` - exactly what the PR proposes.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Conventional commits
    # Bot branches (dependabot, release-please) carry machine-generated commit bodies that get
    # discarded on squash-merge; their conventional-commit contract on `main` is enforced by the
    # Semantic PR title check instead. Skip per-commit linting to avoid noise on bot PRs.
    if: >-
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
